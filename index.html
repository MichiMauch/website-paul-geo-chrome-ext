      IMPECCABLE DIRECTION CONTRACT — "The Radiograph" (the site's landing page;
      the previous "Bold & Minimal" page is archived at /v1 and does not follow this)
      THESIS: An answer engine never sees the page a visitor sees; it reads the
        structure underneath. This surface is a light box. It refuses the dark-SaaS
        hero of gradient glow, three feature columns and a tilted browser screenshot.
      OWN-WORLD: Radiographic film — near-black plate with a real gray density ramp
        as the specimen, teal #33CCCC reserved for the instrument's reading
        (measurement, annotation, control), neutral paper for the printed report.
        Big Shoulders Display at signage scale, Azeret Mono for stamps, findings and
        code, Archivo for reading copy — all three self-hosted. Fiducial registration
        marks, a film-edge stamp strip, ROI marks on drawn leader lines, and fault red
        #ff5c45 for anything the instrument flags. No cards, no eyebrows; one calibrated
        halation, on the specimen's brightest emission and nowhere else. The mascot stays
        out of the page composition but remains the tab icon — PRODUCT.md records Paul as
        a confirmed brand commitment, and that outranks this contract.
      STORY: The visitor watches a real page x-rayed, believes AI-readiness is
        measurable, and installs the extension.
      FIRST VIEWPORT: Film-edge stamp strip across the top; "AI SEES THROUGH YOUR
        PAGE." at signage scale on the left; beneath it one sentence of offer and the
        stamped ADD TO CHROME control; on the right a live plate of a specimen page
        with a draggable exposure divider — rendered page one side, radiograph the other.
      FORM: Radiograph reading room — candidate 5 of 7, seed key 547f6b5d.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
        finish review, the verdict, and DESIGN.md
